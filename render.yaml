# Render Blueprint (STAGING). NOT applied: provisioning needs a Render account and will create billable resources.
# Secrets marked `sync: false` are entered in the Render dashboard; nothing sensitive is committed.
services:
  - type: web
    name: vand-api-staging
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: starter
    healthCheckPath: /healthz
    numInstances: 1            # scale horizontally after load testing; state lives in Postgres/Redis
    # Migrations are NOT run here: owner credentials must never exist in the API/worker runtime. See .github/workflows/deploy-staging.yml (migrate job).
    envVars:
      - { key: VAND_ENV, value: staging }
      - { key: VAND_AUTH_MODE, value: oidc }
      - { key: VAND_PUBLIC_BASE_URL, sync: false }          # https://<staging web origin>
      - { key: VAND_CORS_ORIGINS, sync: false }
      - { key: VAND_OIDC_ISSUER, sync: false }              # https://<tenant>.auth0.com/
      - { key: VAND_OIDC_AUDIENCE, sync: false }
      - { key: VAND_OIDC_JWKS_URL, sync: false }
      - { key: VAND_OIDC_CLIENT_ID, sync: false }
      - { key: VAND_OIDC_CLIENT_SECRET, sync: false }
      - { key: VAND_SESSION_ENCRYPTION_KEY, sync: false }
      - { key: VAND_ORIGIN_AUTH_SECRET, sync: false }
      - { key: VAND_DATABASE_URL, sync: false }             # Neon POOLED endpoint, role vand_app
      - { key: VAND_WORKER_DATABASE_URL, sync: false }      # role vand_worker
      - { key: VAND_DB_DISABLE_STATEMENT_CACHE, value: "true" }
      - { key: VAND_REDIS_URL, fromService: { type: keyvalue, name: vand-redis-staging, property: connectionString } }
      - { key: VAND_STORAGE_BACKEND, value: s3 }
      - { key: VAND_S3_ENDPOINT_URL, sync: false }          # https://<account>.r2.cloudflarestorage.com
      - { key: VAND_S3_BUCKET, sync: false }
      - { key: VAND_S3_ACCESS_KEY_ID, sync: false }
      - { key: VAND_S3_SECRET_ACCESS_KEY, sync: false }
      - { key: VAND_SCANNER_BACKEND, value: clamd }
      - { key: VAND_SCAN_REQUIRED, value: "true" }
      - { key: VAND_CLAMD_HOST, fromService: { type: pserv, name: vand-clamav-staging, property: host } }
      - { key: VAND_ANTHROPIC_API_KEY, sync: false }
  - type: worker
    name: vand-worker-staging
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: starter
    dockerCommand: python -m app.worker
    envVars:
      - fromGroup: vand-staging-shared   # create in the dashboard: same VAND_* values as the API (worker uses VAND_WORKER_DATABASE_URL)
  - type: pserv
    name: vand-clamav-staging
    runtime: image
    image: { url: docker.io/clamav/clamav:stable }
    plan: pro                  # ClamAV docs recommend 4 GB RAM (>=1.2 GiB signatures, ~2x during daily reload); 2 GB risks OOM kills. Billed per second: suspend when not testing.
    envVars: []
keyvalue:
  - name: vand-redis-staging
    plan: starter
    ipAllowList: []            # private network only
