name: Deploy staging (manual)
# NOT yet exercised: requires the secrets below and provisioned Cloudflare/Render accounts. Never auto-deploys.
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: deploy-staging, cancel-in-progress: false }
jobs:
  migrate:
    # Owner/migration credentials live ONLY in this GitHub environment secret, never in Render. Requires reviewer approval on `staging`.
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/api/requirements.lock.txt }
      - run: pip install -r services/api/requirements.lock.txt
      - name: Apply migrations (direct Neon endpoint, role vand_owner)
        working-directory: services/api
        env: { OWNER_DATABASE_URL: "${{ secrets.STAGING_OWNER_DATABASE_URL }}" }
        run: alembic upgrade head
  web:
    runs-on: ubuntu-latest
    environment: staging       # configure required reviewers on this environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: apps/web
      - run: npx wrangler deploy
        working-directory: apps/web
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
  api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render deploy (image build + preDeploy migrations happen on Render)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}" && curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}"
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS "${{ vars.STAGING_WEB_URL }}/api/v1/auth/config" && exit 0; sleep 10; done; exit 1
