name: Deploy staging (manual)
# NOT yet exercised: requires the secrets below and provisioned Neon/Render accounts. Never auto-deploys.
# The SPA + /api/v1 gateway deploy through the existing Vercel project's Git integration (ADR 0007), not from here.
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: deploy-staging, cancel-in-progress: false }
jobs:
  migrate:
    # Owner/migration credentials live ONLY in this GitHub environment secret, never in Render. Requires reviewer approval on `staging`.
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/api/requirements.lock.txt }
      - run: pip install -r services/api/requirements.lock.txt
      - name: Apply migrations (direct Neon endpoint, role vand_owner)
        working-directory: services/api
        env: { OWNER_DATABASE_URL: "${{ secrets.STAGING_OWNER_DATABASE_URL }}" }
        run: alembic upgrade head
  api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render deploy (image build + preDeploy migrations happen on Render)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}" && curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}"
      - name: Smoke test (through the Vercel gateway; direct origin must be refused)
        env: { WEB: "${{ vars.STAGING_WEB_URL }}", API: "${{ vars.STAGING_API_URL }}" }
        run: |
          ok=0; for i in $(seq 1 30); do curl -fsS "$WEB/api/v1/auth/config" | grep -q '"oidc"' && ok=1 && break; sleep 10; done
          [ "$ok" = 1 ] || { echo "gateway/API not healthy"; exit 1; }
          if [ -n "$API" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/auth/config"); [ "$code" = 403 ] || { echo "direct origin returned $code, expected 403"; exit 1; }
          fi
