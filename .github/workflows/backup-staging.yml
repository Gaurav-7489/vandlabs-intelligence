name: Backup staging DB (manual until secrets exist)
# Logical backup of the staging Neon DB, encrypted client-side, stored in a private R2 bucket. NOT yet exercised.
# Neon Free keeps only ~6 h of history, so this is the real backup. Add `schedule:` once secrets are configured.
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Install tools (Postgres client comes from the postgres:17 image to match Neon PG 17 exactly)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq awscli gnupg
      - name: Dump (read-only BYPASSRLS role), encrypt, upload
        env:
          BACKUP_URL: ${{ secrets.STAGING_BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          f="vand-staging-$(date -u +%Y%m%dT%H%M%SZ).pgc"
          # Ubuntu's default client is v16, which refuses to dump a PG 17 server: use the matching image.
          docker run --rm -v "$PWD:/out" -w /out postgres:17 pg_dump "$BACKUP_URL" -Fc -f "/out/$f"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
          rm "$f"
          aws s3 cp "$f.gpg" "s3://vand-intel-staging-backups/$f.gpg" --endpoint-url "$R2_ENDPOINT"
          echo "uploaded $f.gpg ($(stat -c %s "$f.gpg") bytes)"
