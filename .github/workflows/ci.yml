name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/api/requirements.lock.txt }
      - run: pip install -r services/api/requirements.lock.txt
      - name: Create roles and databases
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/database/roles.sql
          psql -h localhost -U postgres -c "CREATE DATABASE vand_test OWNER vand_owner"
      - name: Lint (ruff)
        working-directory: services/api
        run: ruff check .
      - name: Type check (mypy)
        working-directory: services/api
        run: mypy app
      - name: Tests (real Postgres + Redis, migrations applied from scratch)
        working-directory: services/api
        run: pytest -q
      - name: Dependency vulnerability scan
        working-directory: services/api
        run: pip-audit -r requirements.in

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan for committed secrets
        run: |
          pip install detect-secrets
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
