name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17   # matches Neon staging (PG 17)
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/api/requirements.lock.txt }
      - run: pip install -r services/api/requirements.lock.txt
      - name: Create roles and databases
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/database/roles.sql
          psql -h localhost -U postgres -c "CREATE DATABASE vand_test OWNER vand_owner"
      - name: Lint (ruff)
        working-directory: services/api
        run: ruff check .
      - name: Type check (mypy)
        working-directory: services/api
        run: mypy app
      - name: Tests (real Postgres + Redis, migrations applied from scratch)
        working-directory: services/api
        env:
          VAND_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vand_test   # pragma: allowlist secret  (throwaway CI container superuser)
        run: pytest -q -rs
      - name: Postgres client matching the server major (17) for dump/restore
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Backup/restore drill (dump as read-only BYPASSRLS role, restore, verify counts + RLS + isolation)
        env:
          PGPASSWORD: postgres
          BACKUP_URL: postgresql://vand_backup:dev_backup_pw@localhost:5432/vand_test  # pragma: allowlist secret  (CI-only)
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres  # pragma: allowlist secret  (CI-only)
          APP_PASSWORD: dev_app_pw  # pragma: allowlist secret  (CI-only)
        run: bash scripts/backup_restore_drill.sh
      - name: OpenAPI contract export is current (the SPA contract test reads it)
        run: python scripts/export_openapi.py | diff -u docs/api/openapi.json -
      - name: Dependency vulnerability scan (tested + production locks)
        working-directory: services/api
        run: |
          pip-audit -r requirements.in
          pip-audit -r requirements.runtime.lock.txt --no-deps --disable-pip
      - name: Production lock pins only CI-tested versions
        run: python scripts/check_runtime_lock.py
      - name: SBOM (CycloneDX) for the production Python dependencies
        working-directory: services/api
        run: pip-audit -r requirements.runtime.lock.txt --no-deps --disable-pip -f cyclonedx-json -o sbom-python.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom-python, path: services/api/sbom-python.cdx.json, retention-days: 30 }
      - name: Migrations apply from scratch and models match schema
        working-directory: services/api
        run: pytest -q tests/test_ratelimit_jobs_ai.py::test_models_match_migrations

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: SBOM (CycloneDX) for shipped frontend dependencies
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom-web.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom-web, path: apps/web/sbom-web.cdx.json, retention-days: 30 }

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:17   # matches Neon staging (PG 17)
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PGPASSWORD: postgres
      VAND_ENV: local
      VAND_MIGRATION_DATABASE_URL: postgresql+psycopg://vand_owner:dev_owner_pw@localhost:5432/vand_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/api/requirements.lock.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r services/api/requirements.lock.txt
      - name: Database
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/database/roles.sql
          psql -h localhost -U postgres -c "CREATE DATABASE vand_dev OWNER vand_owner"
          cd services/api && alembic upgrade head && python -m app.cli create-platform-admin platform@vandlabs.example.com
      - name: Start API + worker
        working-directory: services/api
        run: |
          nohup uvicorn app.main:create_app --factory --port 8000 > /tmp/api.log 2>&1 &
          nohup python -m app.worker > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
      - name: Seed synthetic demo orgs
        run: python scripts/seed_demo.py
      - name: Web + browser tooling
        run: |
          (cd apps/web && npm ci && nohup npx vite --port 5173 > /tmp/vite.log 2>&1 &)
          (cd tests/e2e && npm install --no-audit --no-fund && npx playwright install --with-deps chromium)
          bash scripts/wait_for.sh http://localhost:5173/ 120
      - name: E2E - evidence to outcome workflow (dev auth)
        run: node tests/e2e/workflow.mjs
      - name: E2E - real OIDC browser flow against test issuer
        run: |
          PGPASSWORD=dev_owner_pw psql -h localhost -U vand_owner -d vand_dev -f tests/e2e/seed_oidc.sql
          PY=python bash tests/e2e/run_oidc_stack.sh
          node tests/e2e/auth.mjs
      - if: failure()
        run: tail -n 50 /tmp/api.log /tmp/worker.log /tmp/api-oidc.log || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan for committed secrets
        run: |
          pip install detect-secrets
          git ls-files | grep -vE 'package-lock|requirements.*lock|openapi.json|secrets.baseline|\.png$' | xargs detect-secrets-hook --baseline .secrets.baseline
